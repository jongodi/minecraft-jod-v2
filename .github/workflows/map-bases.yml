name: Map bases

# Copies the base maps (src/lib/map-bases.json) off the Minecraft server into
# Vercel Blob when started by hand: from the admin panel (Þjónn →
# Grunnkortin), or here under Actions → Map bases → Run workflow. Each base is
# first compared with the copy the site has, and nothing is fetched or sent
# for one that hasn't changed. It runs whether the server is on or not (a
# stopped server's files come off exaroton as quickly); the log says which,
# and how long each step took. A changed one goes up as a few packs under
# bluemap-bases/<id>/ (npm run map:bases -- --upload), its manifest is
# committed to main, which Vercel deploys, and once that deployment is live
# the copy it replaced is dropped (--prune).
#
# Never touches the main map: that is map-sync.yml, under bluemap-data/.
#
# Needs the same two repository secrets as Map sync (Settings → Secrets and
# variables → Actions): EXAROTON_API_KEY and BLOB_READ_WRITE_TOKEN.

on:
  workflow_dispatch:
    inputs:
      bases:
        description: Base maps to copy, by id, separated by spaces (all of them if empty)
        type: string
        default: ''
      force:
        description: Send even if nothing changed
        type: boolean
        default: false
      server_off:
        description: The server was stopped when this was started (only names the run)
        type: boolean
        default: false

# the admin panel reads which bases a run was for, and how, from this name
run-name: "${{ format('Map bases: {0}{1}{2}', inputs.bases || 'all', inputs.force && ', forced' || '', inputs.server_off && ', server off' || '') }}"

permissions:
  contents: write
  # to see when Vercel has deployed the new manifests
  statuses: read

# one at a time; a run started while one is going waits for it
concurrency:
  group: map-bases
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'jongodi/minecraft-jod-v2'
    runs-on: ubuntu-latest
    # The first copy of all four (2.1 GB, Joðville 1.5 GB of it) took 15
    # minutes off a stopped server, no slower than off a running one; the
    # limit leaves room for a slow day.
    timeout-minutes: 120

    steps:
      - name: Check the secrets
        env:
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          missing=""
          [ -n "$EXAROTON_API_KEY" ] || missing="$missing EXAROTON_API_KEY"
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing="$missing BLOB_READ_WRITE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the base maps as the last run fetched them, so a changed one only
      # fetches what BlueMap redrew
      - name: Restore the base maps
        uses: actions/cache/restore@v4
        with:
          path: scripts/out/map-bases
          key: map-bases-${{ github.run_id }}
          restore-keys: map-bases-

      # A base that fails is said so and the others still go up; the run is
      # marked failed at the end, after what did go up is published.
      - name: Copy the base maps
        id: copy
        run: |
          set -f
          args="--upload ${BASES//,/ }"
          [ "$FORCE" = "true" ] && args="$args --force"
          npm run map:bases -- $args
        env:
          BASES: ${{ inputs.bases }}
          FORCE: ${{ inputs.force }}
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: See which bases changed
        id: changed
        if: ${{ !cancelled() }}
        run: |
          ids=$(git status --porcelain -- src/lib/map-bases | sed -E 's#.*src/lib/map-bases/([a-z0-9-]+)\.json$#\1#' | xargs)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          [ -n "$ids" ] && echo "New copies: $ids" || echo "No base map changed."

      - name: Publish the new copies
        id: publish
        if: ${{ !cancelled() && steps.changed.outputs.ids != '' }}
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: |
          git add src/lib/map-bases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "New base map copies: $IDS (automatic)"
          # someone may have pushed while this ran
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Keep the base maps for the next run
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: scripts/out/map-bases
          key: map-bases-${{ github.run_id }}

      # The site reads the old copy until the new manifests are deployed, so
      # it is dropped only once Vercel says the commit is live. Should that
      # take too long, the base's next upload or npm run map:bases -- --prune
      # drops it.
      - name: Drop the replaced copies once the site has the new ones
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publish.outputs.sha }}
          IDS: ${{ steps.changed.outputs.ids }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -f
          for i in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // ""' || true)
            case "$state" in
              success)
                npm run map:bases -- --prune $IDS
                exit 0 ;;
              failure|error)
                echo "::warning::Vercel did not deploy $SHA ($state); the replaced copies stay until npm run map:bases -- --prune $IDS."
                exit 0 ;;
            esac
            sleep 20
          done
          echo "::warning::The site was not deployed within half an hour; the replaced copies stay until npm run map:bases -- --prune $IDS."
