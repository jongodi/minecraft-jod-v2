name: Map sync

# Copies the BlueMap map off the Minecraft server into Vercel Blob when it is
# started by hand: from the admin panel (Þjónn → Þrívíddarkortið), or here
# under Actions → Map sync → Run workflow. A run does nothing when BlueMap
# hasn't redrawn anything since the last copy, and nothing while the server is
# stopped unless it is told to copy anyway: exaroton hands out files very
# slowly then, so such a run can take a long time. Otherwise it uploads the new
# copy as a few packs and commits it to main, which Vercel deploys.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# EXAROTON_API_KEY and BLOB_READ_WRITE_TOKEN, the same as in .env.local.

on:
  workflow_dispatch:
    inputs:
      offline:
        description: Copy even if the server is stopped (slow)
        type: boolean
        default: false

# the admin panel tells the two kinds of run apart by this name
run-name: ${{ inputs.offline && 'Map sync, server off' || 'Map sync' }}

permissions:
  contents: write

# one sync at a time; a run started while one is going waits for it
concurrency:
  group: map-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jongodi/minecraft-jod-v2'
    runs-on: ubuntu-latest
    # the first run, or one after the saved copy has expired, fetches the whole
    # map, and off a stopped server that takes far longer
    timeout-minutes: ${{ inputs.offline && 300 || 90 }}

    steps:
      - name: Check the secrets
        env:
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          missing=""
          [ -n "$EXAROTON_API_KEY" ] || missing="$missing EXAROTON_API_KEY"
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing="$missing BLOB_READ_WRITE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the map as the last run left it, so only what BlueMap redrew is fetched
      - name: Restore the map copy
        uses: actions/cache/restore@v4
        with:
          path: public/bluemap-data
          key: map-copy-${{ github.run_id }}
          restore-keys: map-copy-

      - name: Sync the map
        run: |
          if [ "$OFFLINE" = "true" ]; then
            npm run map:sync
          else
            npm run map:sync -- --only-online
          fi
        env:
          OFFLINE: ${{ inputs.offline }}
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Publish the new copy
        id: publish
        run: |
          git add public/bluemap src/lib/bluemap-snapshot.json src/lib/bluemap-viewer.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "New map copy (automatic)"
          # someone may have pushed while this ran
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the map copy for the next run
        if: steps.publish.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: public/bluemap-data
          key: map-copy-${{ github.run_id }}
