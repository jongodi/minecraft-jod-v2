name: Map sync

# Copies the BlueMap map off the Minecraft server into Vercel Blob when it is
# started by hand: from the admin panel (Þjónn → Þrívíddarkortið), or here
# under Actions → Map sync → Run workflow, whether the server runs or not: a
# stopped server's files come off exaroton as quickly as a running one's. A run
# does nothing when BlueMap hasn't redrawn anything since the last copy.
# Otherwise it uploads the new copy as a few packs, takes a new still of the
# map (npm run map:poster), and commits both to main, which Vercel deploys.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# EXAROTON_API_KEY and BLOB_READ_WRITE_TOKEN, the same as in .env.local.

on:
  workflow_dispatch:
    inputs:
      server_off:
        description: The server was stopped when this was started (only names the run)
        type: boolean
        default: false

# the admin panel marks a run started while the server was stopped by this name
run-name: ${{ inputs.server_off && 'Map sync, server off' || 'Map sync' }}

permissions:
  contents: write

# one sync at a time; a run started while one is going waits for it
concurrency:
  group: map-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jongodi/minecraft-jod-v2'
    runs-on: ubuntu-latest
    # the first run, or one after the saved copy has expired, fetches the whole
    # map: about ten minutes, most of it waiting on exaroton's request limit
    timeout-minutes: 90

    steps:
      - name: Check the secrets
        env:
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          missing=""
          [ -n "$EXAROTON_API_KEY" ] || missing="$missing EXAROTON_API_KEY"
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing="$missing BLOB_READ_WRITE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing:$missing. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the map as the last run left it, so only what BlueMap redrew is fetched
      - name: Restore the map copy
        uses: actions/cache/restore@v4
        with:
          path: public/bluemap-data
          key: map-copy-${{ github.run_id }}
          restore-keys: map-copy-

      - name: Sync the map
        run: npm run map:sync
        env:
          EXAROTON_API_KEY: ${{ secrets.EXAROTON_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: See whether the map changed
        id: changed
        run: |
          if [ -n "$(git status --porcelain -- public/bluemap src/lib/bluemap-snapshot.json src/lib/bluemap-viewer.json)" ]; then
            echo "map=true" >> "$GITHUB_OUTPUT"
          else
            echo "map=false" >> "$GITHUB_OUTPUT"
          fi

      # A new copy gets a new still: the home page opens on it until the 3D
      # map is started. Taken off the local copy through a dev server, in the
      # runner's Chrome drawing WebGL in software. Should it fail, the copy is
      # published anyway, with the still it had.
      - name: Take the map's still
        if: steps.changed.outputs.map == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          npx next dev -p 3000 > next-dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/bluemap/settings.json && break; sleep 2; done
          npm run map:poster
        env:
          CI: 'true'
          POSTER_SCALE: '2'

      - name: Publish the new copy
        id: publish
        run: |
          git add public/bluemap src/lib/bluemap-snapshot.json src/lib/bluemap-viewer.json public/map-poster.webp src/lib/map-poster.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "New map copy (automatic)"
          # someone may have pushed while this ran
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Keep the map copy for the next run
        if: steps.publish.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: public/bluemap-data
          key: map-copy-${{ github.run_id }}
