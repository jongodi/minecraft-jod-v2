<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- a leather tag with the JOÐ brand burnt in: a pixel J inside an iron ring -->
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3220"/>
      <stop offset="1" stop-color="#2a1b10"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#leather)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#e8d6b4" stroke-opacity="0.45" stroke-width="0.8" stroke-dasharray="1.6 1.4"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#e2692f" stroke-opacity="0.35" stroke-width="3.5"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#e2692f" stroke-width="1.8"/>
  <g fill="#e2692f" shape-rendering="crispEdges">
    <!-- row 0 -->
    <rect x="12.25" y="7.25" width="2.5" height="2.5"/>
    <rect x="14.75" y="7.25" width="2.5" height="2.5"/>
    <rect x="17.25" y="7.25" width="2.5" height="2.5"/>
    <rect x="19.75" y="7.25" width="2.5" height="2.5"/>
    <!-- rows 1 to 3 -->
    <rect x="17.25" y="9.75" width="2.5" height="2.5"/>
    <rect x="17.25" y="12.25" width="2.5" height="2.5"/>
    <rect x="17.25" y="14.75" width="2.5" height="2.5"/>
    <rect x="17.25" y="17.25" width="2.5" height="2.5"/>
    <!-- rows 4 and 5 -->
    <rect x="9.75" y="17.25" width="2.5" height="2.5"/>
    <rect x="9.75" y="19.75" width="2.5" height="2.5"/>
    <rect x="17.25" y="19.75" width="2.5" height="2.5"/>
    <!-- row 6 -->
    <rect x="12.25" y="22.25" width="2.5" height="2.5"/>
    <rect x="14.75" y="22.25" width="2.5" height="2.5"/>
  </g>
</svg>
